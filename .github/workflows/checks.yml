name: ZOMBO checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py game.py gear.py security.py tests
      - name: Verify frontend syntax
        run: node --check static/app.js
      - name: Run regressions and game tests
        env:
          DEMO_MODE: '1'
          DATABASE_URL: sqlite:///./github_actions_test.db
          BOT_TOKEN: ''
          TELEGRAM_WEBHOOK_SECRET: ''
        run: python -m pytest -q tests
